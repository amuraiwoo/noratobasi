<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ロブロックス ワンタップ合流</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 40px 30px; border-radius: 16px; width: 100%; max-width: 350px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
        h2 { margin-bottom: 15px; font-size: 1.3rem; color: #fff; }
        #status { margin-bottom: 20px; font-size: 0.95rem; color: #aaa; }
        .btn { 
            display: none; 
            background: #4CAF50; 
            color: white; 
            text-decoration: none; 
            padding: 16px 20px; 
            font-size: 1.1rem; 
            font-weight: bold; 
            border-radius: 10px; 
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.4);
            transition: background 0.2s; 
        }
        .btn:hover { background: #45a049; }
        .error { color: #ff6b6b; }
    </style>
</head>
<body>

<div class="card">
    <h2>ロブロックス合流</h2>
    <div id="status">サーバー情報を取得中...</div>
    <!-- 公式のリンク形式がセットされるアンカータグ -->
    <a id="joinBtn" class="btn" href="#" target="_blank">ゲームに参加する</a>
</div>

<script>
async function loadServer() {
    const statusDiv = document.getElementById("status");
    const joinBtn = document.getElementById("joinBtn");
    const API_URL = "https://api.npoint.io/0be10f3d40939b926772?t=" + new Date().getTime();

    try {
        const response = await fetch(API_URL);
        const data = await response.json();

        if (data && data.placeId && data.jobId) {
            statusDiv.className = "";
            statusDiv.innerHTML = `サーバー発見！<br><span style="color:#4CAF50;">準備完了しました</span>`;
            
            // 教えてくれた最強の公式リンク形式をそのままURLに組み立てる
            const officialUrl = `https://www.roblox.com/games/start?placeId=${data.placeId}&gameId=${data.jobId}`;
            
            // ボタンのリンク先を書き換えて表示する
            joinBtn.href = officialUrl;
            joinBtn.style.display = "block";
        } else {
            statusDiv.className = "error";
            statusDiv.innerHTML = "有効なサーバーデータがありません。<br>ゲーム内でスクリプトを実行してください。";
        }
    } catch (error) {
        statusDiv.className = "error";
        statusDiv.innerHTML = "データの取得に失敗しました。";
        console.error(error);
    }
}

window.onload = loadServer;
</script>

</body>
</html>
