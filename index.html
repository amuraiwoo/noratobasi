<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ロブロックス ワンタップ自動参加</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 12px; width: 100%; max-width: 350px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { margin-bottom: 10px; font-size: 1.2rem; color: #ddd; }
        #status { margin-top: 15px; font-size: 0.95rem; color: #aaa; }
        .success { color: #4CAF50; }
        .error { color: #ff6b6b; }
    </style>
</head>
<body>

<div class="card">
    <h2>ロブロックス自動参加</h2>
    <div id="status" class="success">サーバー情報を取得中...</div>
</div>

<script>
async function autoJoin() {
    const statusDiv = document.getElementById("status");
    const API_URL = "https://api.npoint.io/0be10f3d40939b926772?t=" + new Date().getTime();

    try {
        const response = await fetch(API_URL);
        const data = await response.json();

        if (data && data.placeId && data.jobId) {
            statusDiv.className = "success";
            statusDiv.innerHTML = `サーバー発見！<br>直接起動します...`;
            
            // roblox:// スキームを使うことで、ブラウザの中継ページを挟まずにダイレクト起動を狙う
            const joinUrl = `roblox://navigation/game_launch?placeId=${data.placeId}&gameId=${data.jobId}`;
            
            setTimeout(() => {
                window.location.href = joinUrl;
            }, 300);
        } else {
            statusDiv.className = "error";
            statusDiv.innerHTML = "有効なサーバーデータがありません。<br>ゲーム内でスクリプトを実行してください。";
        }
    } catch (error) {
        statusDiv.className = "error";
        statusDiv.innerHTML = "データの取得に失敗しました。";
        console.error(error);
    }
}

window.onload = autoJoin;
</script>

</body>
</html>
