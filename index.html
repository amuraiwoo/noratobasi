<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ロブロックス ワンタップ参加</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .card { background: #1e1e1e; padding: 40px 30px; border-radius: 16px; width: 100%; max-width: 350px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.6); pointer-events: none; }
        h2 { margin-bottom: 15px; font-size: 1.3rem; color: #fff; }
        #status { margin-bottom: 10px; font-size: 0.95rem; color: #aaa; }
        .hint { font-size: 0.85rem; color: #4CAF50; font-weight: bold; margin-top: 15px; }
        .error { color: #ff6b6b; }
    </style>
</head>
<body onclick="joinGame()">

<div class="card">
    <h2>ロブロックス直行パネル</h2>
    <div id="status">サーバー情報を確認中...</div>
    <div class="hint" id="hintText" style="display:none;">画面のどこでもいいのでタップ！</div>
</div>

<script>
let targetUrl = "";
let isReady = false;

async function fetchServer() {
    const statusDiv = document.getElementById("status");
    const hintText = document.getElementById("hintText");
    const API_URL = "https://api.npoint.io/0be10f3d40939b926772?t=" + new Date().getTime();

    try {
        const response = await fetch(API_URL);
        const data = await response.json();

        if (data && data.placeId && data.jobId) {
            statusDiv.className = "";
            statusDiv.innerHTML = `サーバー発見！<br><span style="color:#4CAF50;">準備完了しました</span>`;
            
            targetUrl = `https://www.roblox.com/games/start?placeId=${data.placeId}&gameId=${data.jobId}`;
            isReady = true;
            hintText.style.display = "block";
        } else {
            statusDiv.className = "error";
            statusDiv.innerHTML = "有効なサーバーデータがありません。<br>ゲーム内でスクリプトを実行してください。";
        }
    } catch (error) {
        statusDiv.className = "error";
        statusDiv.innerHTML = "データの取得に失敗しました。";
        console.error(error);
    }
}

function joinGame() {
    if (isReady && targetUrl) {
        window.location.href = targetUrl;
    }
}

window.onload = fetchServer;
</script>

</body>
</html>
