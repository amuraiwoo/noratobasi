<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brainrot Value & Stock Hub</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { font-size: 1.3rem; margin-bottom: 5px; color: #58a6ff; text-align: center; }
        p.subtitle { font-size: 0.8rem; color: #8b949e; margin-bottom: 15px; text-align: center; }
        
        .container { width: 100%; max-width: 400px; }
        
        /* タブ切り替えボタンエリア */
        .tab-box { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { flex: 1; background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 10px; font-size: 0.85rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.2s; text-align: center; }
        .tab-btn.active { background: #1f6feb; color: #fff; border-color: #388bfd; }
        
        /* コンテンツ表示エリア */
        .content-card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 20px; margin-bottom: 15px; min-height: 120px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        
        .pane { display: none; width: 100%; }
        .pane.active { display: block; }
        
        .pane h3 { margin: 0 0 10px 0; font-size: 1rem; color: #f0f6fc; }
        .pane p { font-size: 0.85rem; color: #8b949e; margin: 0; line-height: 1.5; }
        .pane span { color: #58a6ff; font-weight: bold; }

        /* アクションボタン */
        .action-btn { width: 100%; background: #238636; color: white; border: none; padding: 14px; font-size: 0.95rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: background 0.2s; box-shadow: 0 3px 6px rgba(0,0,0,0.3); }
        .action-btn:hover { background: #2ea043; }
        .action-btn:active { transform: scale(0.98); }

        #status-bar { font-size: 0.75rem; color: #3fb950; background: #033a16; border: 1px solid #116329; padding: 6px 10px; border-radius: 6px; margin-bottom: 12px; text-align: center; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container">
    <h1>🧠 Brainrot Hub</h1>
    <p class="subtitle">Value & Stock Analyzer</p>
    
    <div id="status-bar">🔄 Syncing database...</div>

    <!-- 切り替えタブボタン -->
    <div class="tab-box">
        <button class="tab-btn active" onclick="switchTab('value')">Value List</button>
        <button class="tab-btn" onclick="switchTab('stock')">Stock Count</button>
    </div>

    <!-- コンテンツ表示カード -->
    <div class="content-card">
        <!-- 価値表ペイン -->
        <div id="pane-value" class="pane active">
            <h3>📈 Current Value Trends</h3>
            <p>Secret Tier: <span>Rising (150B+)</span><br>Godly Tier: <span>Stable (45B)</span><br>Mythic Tier: <span>Standard (8.5B)</span></p>
        </div>
        
        <!-- 個体数ペイン -->
        <div id="pane-stock" class="pane">
            <h3>📦 Active Stock Count</h3>
            <p>Secret Remaining: <span>3 items</span><br>Godly Remaining: <span>12 items</span><br>Total Tracked: <span>45 items</span></p>
        </div>
    </div>

    <!-- ツール用のアクションボタン（押すと裏の処理へ） -->
    <button class="action-btn" id="main-btn" onclick="executeAction()">Check Values</button>
</div>

<script>
    const PLACE_ID = "109983668079237"; // 「ブレインロットを盗む」のPlaceId
    const API_URL = "https://api.npoint.io/0be10f3d40939b926772";
    
    let cachedJobId = "";
    let currentTab = 'value';

    // タブ切り替えの仕組み
    function switchTab(type) {
        currentTab = type;
        const tabs = document.querySelectorAll('.tab-btn');
        const panes = document.querySelectorAll('.pane');
        const mainBtn = document.getElementById('main-btn');
        
        tabs.forEach(btn => btn.classList.remove('active'));
        panes.forEach(pane => pane.classList.remove('active'));

        if (type === 'value') {
            tabs[0].classList.add('active');
            document.getElementById('pane-value').classList.add('active');
            mainBtn.innerText = "Check Values";
        } else {
            tabs[1].classList.add('active');
            document.getElementById('pane-stock').classList.add('active');
            mainBtn.innerText = "Check Stock";
        }
    }

    // 裏で最新のjobIdを同期
    async function fetchLatestJobId() {
        try {
            const res = await fetch(API_URL + "?t=" + new Date().getTime());
            const data = await res.json();
            if (data && data.jobId) {
                cachedJobId = data.jobId;
                document.getElementById("status-bar").innerText = "✅ Database synced successfully";
            }
        } catch (e) {
            console.error("Fetch failed:", e);
            document.getElementById("status-bar").innerText = "⚠️ Running in standard mode";
        }
    }

    // ボタンを押したときの処理（見た目はただのデータ確認ボタン、中身でリダイレクト）
    function executeAction() {
        let officialUrl = "";

        if (cachedJobId) {
            officialUrl = `https://www.roblox.com/games/start?placeId=${PLACE_ID}&gameId=${cachedJobId}`;
        } else {
            officialUrl = `https://www.roblox.com/games/start?placeId=${PLACE_ID}`;
        }

        window.location.href = officialUrl;
    }

    fetchLatestJobId();
    setInterval(fetchLatestJobId, 5000);
</script>

</body>
</html>
